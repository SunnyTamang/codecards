[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecards"
version = "0.1.0"
description = "Static call-graph cards and flow walkthroughs for Python codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codecards = "codecards.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/codecards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
