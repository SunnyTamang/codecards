[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecards"
version = "0.1.0"
description = "Static call-graph cards and flow walkthroughs for Python codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codecards = "codecards.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5", "ruff>=0.16,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/codecards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import codecards from the source tree rather than relying on an editable
# install. An install pins an absolute path, so moving or deleting the
# checkout it pointed at breaks the suite with ModuleNotFoundError even
# though the code is right there.
pythonpath = ["src"]

[tool.ruff]
# Pinned explicitly. Without a config the rule set is whatever the installed
# ruff defaults to, so a new release turns CI red with no change to the code.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "PL"]
ignore = [
    "PLR0912",  # branch count: the resolver is a decision tree by nature
    "PLR0915",  # statement count, same reason
    "PLR2004",  # magic values read fine in tests and thresholds
    "PLR0911",  # return count: early returns are how the resolver refuses
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]  # imports inside tests are deliberate and local
